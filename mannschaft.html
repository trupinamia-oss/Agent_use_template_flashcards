<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesamtprogress der Mannschaft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="club-name">SPORTVEREIN</p>
      <h1>Unsere Mannschaft</h1>
      <nav class="main-navigation">
        <a href="index.html">Trainingstagebuch</a>
        <a href="avatar.html">Avatar</a>
        <a class="active" href="mannschaft.html">Mannschaft</a>
      </nav>
    </header>

    <section class="team-card">
      <h2>Gesamtprogress</h2>
      <p id="team-training">Noch keine gemeinsamen Fortschritte.</p>

      <div class="team-stats">
        <p><strong>Trainingseinheiten</strong> <span id="team-training-count">0</span></p>
        <p><strong>Trainingsminuten</strong> <span id="team-minutes">0</span></p>
        <p><strong>Fortschritt</strong> <span id="team-progress">0</span></p>
        <p><strong>Regelmäßigkeit</strong> <span id="team-regularity">0</span></p>
      </div>

      <div class="story-stage">
        <h3 id="story-name">Vorbereitung</h3>
        <p id="story-text">Das Team beginnt gemeinsam die Vorbereitung auf die Saison.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

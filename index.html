<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Worth Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Net Worth Tracker</h1>

        <button id="show-categories-button" type="button" class="secondary-button">
            Kategorien verwalten
        </button>
        <button id="show-balances-button" type="button" class="secondary-button">
            Kontostand verwalten
        </button>

        <section id="balance-section" class="category-section hidden">
            <h2>Kontostand verwalten</h2>
            <form id="balance-form">
                <label for="balance-account">Konto</label>
                <select id="balance-account" required></select>

                <label for="balance-amount">Neuer Kontostand in €</label>
                <input id="balance-amount" type="number" step="0.01" required>

                <button type="submit">Kontostand speichern</button>
            </form>
        </section>

        <section id="category-section" class="category-section hidden">
            <h2>Kategorien verwalten</h2>
            <form id="category-form">
                <label for="new-category">Neue Kategorie</label>
                <input id="new-category" type="text" placeholder="Zum Beispiel Gesundheit" required>
                <label for="category-symbol">Symbol</label>
                <select id="category-symbol" required>
                    <option value="✨">✨ Sonstiges</option>
                    <option value="🍔">🍔 Essen</option>
                    <option value="👕">👕 Kleidung</option>
                    <option value="🏠">🏠 Wohnen</option>
                    <option value="🚗">🚗 Verkehr</option>
                    <option value="🎮">🎮 Freizeit</option>
                    <option value="💊">💊 Gesundheit</option>
                    <option value="💼">💼 Arbeit</option>
                    <option value="🎁">🎁 Geschnnkkkk</option>
                    <option value="🐾">🐾 Haustier</option>
                </select>
                <button type="submit">Kategorie hinzufügen</button>
            </form>
            <ul id="category-list"></ul>
            <h3>Ausgaben nach Kategorie</h3>
            <ul id="expense-category-list"></ul>
        </section>

        <div class="page-layout">
            <section class="form-section">
                <h2>Werte eintragen</h2>
                <form id="entry-form">
                    <label for="entry-date">Datum</label>
                    <input id="entry-date" type="date" required>

                    <label for="entry-type">Art</label>
                    <select id="entry-type" required>
                        <option value="income">Einnahme</option>
                        <option value="expense">Ausgabe</option>
                        <option value="transfer">Umbuchung</option>
                    </select>

                    <label for="account">Konto</label>
                    <select id="account" required></select>

                    <div id="target-account-field" class="hidden">
                        <label for="target-account">Zielkonto</label>
                        <select id="target-account"></select>
                    </div>

                    <label for="category">Kategorie</label>
                    <select id="category"></select>

                    <label for="amount">Betrag in €</label>
                    <input id="amount" type="number" min="0.01" step="0.01" required>

                    <label for="note">Notiz</label>
                    <input id="note" type="text" placeholder="Optional">

                    <button type="submit">Eintragen</button>
                </form>
            </section>

            <section class="accounts-section">
                <h2>Konten</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Konto</th>
                            <th>Aktueller Stand</th>
                        </tr>
                    </thead>
                    <tbody id="accounts-list"></tbody>
                </table>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainingstagebuch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="club-name">SPORTVEREIN</p>
      <h1>Mein Trainingstagebuch</h1>
      <nav class="main-navigation" aria-label="Hauptnavigation">
        <a class="active" href="index.html">Tagebuch</a>
        <a href="avatar.html">Avatar</a>
        <a href="mannschaft.html">Mannschaft</a>
      </nav>
    </header>

    <section>
      <h2>Neue Trainingseinheit</h2>
      <form id="training-form">
        <label for="training-type">Was wurde trainiert?</label>
        <select id="training-type" required>
          <option value="">Bitte auswählen</option>
          <option>Ausdauer</option>
          <option>Kraft</option>
          <option>Handball</option>
          <option>Technik</option>
          <option>Taktik</option>
          <option>Spiel</option>
          <option>Sonstiges</option>
        </select>
        <div id="other-training-container" hidden>
          <label for="other-training-description">Was genau wurde trainiert?</label>
          <input id="other-training-description" type="text" maxlength="100" placeholder="Zum Beispiel Beweglichkeit">
        </div>

        <label for="training-duration">Wie lange dauerte das Training?</label>
        <select id="training-duration" required>
          <option value="">Dauer auswählen</option>
          <option value="30">30 min</option>
          <option value="60">1 h</option>
          <option value="90">1 h 30 min</option>
          <option value="120">2 h</option>
          <option value="150">2 h 30 min</option>
          <option value="180">3 h</option>
          <option value="210">3 h 30 min</option>
          <option value="custom">Andere Dauer</option>
        </select>
        <div id="custom-duration-container" hidden>
          <label for="custom-duration">Eigene Dauer in Minuten</label>
          <input id="custom-duration" type="number" min="1" max="600" placeholder="Zum Beispiel 45">
        </div>

        <label for="session-rpe">Wie anstrengend war die ganze Einheit? (Session-RPE 0–10)</label>
        <select id="session-rpe" required>
          <option value="">Anstrengung auswählen</option>
          <option value="0">0 – Ruhe</option>
          <option value="1">1 – Sehr leicht</option>
          <option value="2">2 – Leicht</option>
          <option value="3">3 – Mäßig</option>
          <option value="4">4 – Etwas anstrengend</option>
          <option value="5">5 – Anstrengend</option>
          <option value="6">6</option>
          <option value="7">7 – Sehr anstrengend</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10 – Maximal anstrengend</option>
        </select>
        <small>0 = Ruhe, 10 = maximal anstrengend. Direkt nach dem Training einschätzen.</small>

        <button type="submit">Einheit speichern</button>
        <p id="form-message" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section>
      <h2>Meine Trainingseinheiten</h2>
      <p id="entry-count">Noch keine Einträge.</p>
      <ul id="training-list" class="entry-list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
